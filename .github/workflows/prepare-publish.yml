name: Tag a release and publish artifacts if needed

on:
  push:
    branches:
      - '**'

concurrency:
  group: prepare-and-publish
  cancel-in-progress: false

jobs:
  prepare-api:
    uses: statens-pensjonskasse/swagger-tracker/.github/workflows/install-api.yml@5ca3d4d10ffc21d681ce1ac6cb9f9a1b73dfc279  # 0.2.3
    permissions:
      contents: write
      packages: read
    secrets: inherit
    with:
      commit-message: 'chore: install API version'

  publish:
    needs: [ prepare-api ]
    uses: statens-pensjonskasse/openapi-artifact-wrapper/.github/workflows/build-publish-api.yml@e7e8e65e1d015a9220bd96cf55afcd5fbf47cd6e # 0.2.2
    permissions:
      contents: write
      packages: write
    secrets: inherit
    with:
      tbv-script: npm run tbv
      commit-message: 'chore: update project files to API version'
      public-access: true
      publish-from-branch: main
