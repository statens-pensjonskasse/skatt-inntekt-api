name: Tag a release and publish artifacts if needed

on:
  push:
    branches:
      - '**'


concurrency:
  group: renovate-api
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@statens-pensjonskasse'


      - name: update
        run: |
          npm ci
          npm run update-spec
          git status
          git add -A

      - name: Commit changes
        uses: statens-pensjonskasse/gha-create-signed-commit@2343535e0ab61d4bd30954ca59d1fb66f1d85c51 # v0.1.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          message: 'chore: update API spec'
          fail-on-no-changes: false
          push: true

  publish:
    if: github.ref == 'refs/heads/main'
    uses: statens-pensjonskasse/openapi-artifact-wrapper/.github/workflows/api-publish.yml@7a46baf04220b1a96d692104c5d5fea7975eb9f1  # 0.0.3
    with:
      api-spec-json: skatt-inntekt-api.json
      publish-command: npm publish && npm run mvn-publish
    permissions:
      contents: write
      packages: write
    secrets: inherit
