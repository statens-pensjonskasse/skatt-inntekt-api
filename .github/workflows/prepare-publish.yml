name: Run update script and - if appropriate - tag a release and publish artifacts

on:
  push:
    branches:
      - '**'

concurrency:
  group: release-and-publish
  cancel-in-progress: false

jobs:
  update-spec:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26.13.0
          registry-url: https://npm.pkg.github.com
          scope: '@statens-pensjonskasse'

      - name: update
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          npm install # ci is useless on a renovate PR
          npm run update-spec
          git status
          git add -A

      - name: Commit changes
        uses: statens-pensjonskasse/gha-create-signed-commit@7b9e477ae72b66627fb37db6b841f0e31d3d965e # v0.1.5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          message: 'chore: update API spec'
          fail-on-no-changes: false
          push: true

  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    outputs:
      apiversion: ${{ steps.apiversion.outputs.apiversion }}
      released: ${{ steps.goahead.outputs.released }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26.13.0
          registry-url: https://npm.pkg.github.com
          scope: '@statens-pensjonskasse'

      - name: Find version in API specification
        id: apiversion
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          npm install
          API_VERSION=$( node ./node_modules/.bin/openapi-artifact-cli api-version )
          # API_VERSION=$( jq -er '.info.version' ${{ inputs.api-spec-json }} )
          if [ -z "$API_VERSION" ] || [ "$API_VERSION" = "{}" ]; then
            echo "::error::Could not read version from API specification"
            exit 1
          fi
          echo "apiversion=$API_VERSION" >> $GITHUB_OUTPUT

      - name: Check for release tag matching API version
        id: goahead
        run: |
          git fetch --tags
          LAST_GIT_TAG=$(git tag --sort=-v:refname | head -n1)
          if [ -z "$LAST_GIT_TAG" ]; then
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          else
            LAST_RELEASE_VERSION=$(echo "$LAST_GIT_TAG" | awk -F. '{print $1 "." $2 "." $3+1}')
          fi
          if [ "${{ steps.apiversion.outputs.apiversion }}" = "$LAST_RELEASE_VERSION" ]; then
            echo "::info::Terminate release because API specification version ${{ steps.apiversion.outputs.apiversion }} is found in git tag $LAST_RELEASE_VERSION."
            echo "released=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "released=false" >> "$GITHUB_OUTPUT"

      - name: Release if appropriate
        id: release
        if: ${{ !steps.goahead.outputs.released }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.apiversion.outputs.apiversion }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ github.token }}

  publish:
    runs-on: ubuntu-latest
    needs: [ release ]
    if: false # needs.release.outputs.release-performed == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: # node is preinstalled on ubuntu-latest, but publish needs setup-node to configure registry and auth
          node-version: 26.13.0
          registry-url: https://npm.pkg.github.com
          scope: '@statens-pensjonskasse'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          java-version: 25
          distribution: temurin
      - name: Publish artifacts
        id: publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PAT_FOR_PACKAGES_ACCESS || secrets.GITHUB_TOKEN }} # node may need to install a package
          GITHUB_TOKEN: ${{ github.token }} # maven should have no dependencies
        run: |
          npm ci
          npm publish
          npm run mvn-publish
