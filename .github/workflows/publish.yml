name: Build and Publish to GitHub Packages

on:
  push:
    branches:
      - main

jobs:
  release-and-publish-npm:
    uses: statens-pensjonskasse/public-actions-library/.github/workflows/build-library-node.yaml@b1509281d74a1afb44d9ceabfb361f8cf4bec420 # v0.3.6
    permissions:
      contents: write
      packages: write
    secrets: inherit
    with:
      node-version: '24'

  publish-mvn:
    runs-on: ubuntu-latest
    if: needs.release-and-publish-npm.outputs.published == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: temurin
      - name: deploy Maven artifact
        shell: bash
        working-directory: '.'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mvn deploy
