name: Tag a release and publish artifacts if needed

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  versioning:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.apiversion.outputs.apiversion }}
      release: ${{ steps.goahead.outputs.release }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find last git version
        id: gitversion
        run: |
          git fetch --tags
          LAST_GIT_TAG=$(git tag --sort=-v:refname | head -n1)
          if [ -z "$LAST_GIT_TAG" ]; then
            LAST_RELEASE_VERSION="0.0.0"
          else
            LAST_RELEASE_VERSION=$(echo "$LAST_GIT_TAG" | awk -F. '{print $1 "." $2 "." $3+1}')
          fi
          echo "gitversion=$LAST_RELEASE_VERSION" >> $GITHUB_OUTPUT

      - name: Find spec version
        id: apiversion
        run: |
          API_VERSION=$(awk -F': *' '/^[[:space:]]*version:[[:space:]]*/ {print $2; exit}' "$API_SPEC_FILE" | tr -d '"' | tr -d "'" | xargs)
          if [ -z "$API_VERSION" ]; then
            echo "::error::Could not read version from $API_SPEC_FILE"
            exit 1
          fi
          echo "apiversion=$API_VERSION" >> $GITHUB_OUTPUT

      - name: Determine need for release by comparing spec version to last git version tag, abort if they are the same
        id: goahead
        run: |
          if [ "${{ steps.apiversion.outputs.apiversion }}" = "${{ steps.gitversion.outputs.gitversion }}" ]; then
            echo "::info::Terminate release because $API_SPEC_FILE version ${{ steps.apiversion.outputs.apiversion }} is same as git version ${{ steps.gitversion.outputs.gitversion }}."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"

  release:
    runs-on: ubuntu-latest
    needs: [ versioning ]
    if: needs.versioning.outputs.release == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update version in package.json, commit and push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          # tagging is done by release step below
          git tag ${{ needs.versioning.outputs.version }}
          git push origin ${{ needs.versioning.outputs.version }}

      - name: Generate app token for release
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.GH_ACTIONS_LIBRARY_APP_ID }}
          private-key: ${{ secrets.GH_ACTIONS_LIBRARY_APP_KEY }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ steps.app-token.outputs.token }}
          tag_name: ${{ needs.versioning.outputs.version }}
          generate_release_notes: true

  publish-npm:
    runs-on: ubuntu-latest
    needs: [ versioning ]
    if: needs.versioning.outputs.release == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
      - name: Publish npm package
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: npm publish

  publish-mvn:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: temurin
      - name: deploy Maven artifact
        shell: bash
        working-directory: '.'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mvn deploy
