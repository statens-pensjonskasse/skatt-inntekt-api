openapi: 3.0.3
info:
  description: Tjenesten leverer informasjon om arbeidsgivers (opplysningspliktiges) innrapporterte inntektsopplysninger for en inntektsmottaker for en gitt periode.
  version: 1.6.2
  title: Inntekt API
  termsOfService: https://www.skatteetaten.no/deling/bruksvilkar-for-delingstjenester
  contact:
    name: Brukerstøtte
    url: https://www.skatteetaten.no/deling/kontakt/
servers:
  - url: https://inntekt.api.skatteetaten-test.no/v1
    description: Ekstern test
  - url: https://inntekt.api.skatteetaten.no/v1
    description: Produksjon
security:
  - maskinporten:
      - skatteetaten:inntekt
externalDocs:
  description: Dokumentasjon på Skatteetatens GitHub
  url: https://skatteetaten.github.io/api-dokumentasjon/api/inntekt
paths:
  /{rettighetspakke}/{personidentifikator}/inntekter:
    get:
      summary: Hent innrapporterte inntekter for person
      description: Hent innrapporterte innteker for person
      operationId: hentInntektForPerson
      tags:
        - Inntekt
      parameters:
        - name: rettighetspakke
          in: path
          description: Datakonsumenter plasseres i en rettighetspakke (per datasett) basert paa en juridisk vurdering. Rettighetspakken styrer Skjermingsregler, Filtrering og Detaljering som benyttes nÃ¥r det gis innsyn i data i datasett.
          required: true
          schema:
            type: string
        - name: personidentifikator
          in: path
          description: personidentifikator
          required: true
          schema:
            type: string
          example: 12345678901
        - name: fraOgMed
          in: query
          description: Fra og med hvilken periode innrapporterte inntekter skal leveres.
          required: false
          schema:
            type: string
          example: 2020-01
        - name: tilOgMed
          in: query
          description: Til og med hvilken periode innrapporterte inntekter skal leveres. Valgfritt parameter. Dersom tilOgMed ikke er satt brukes inneværende måned som parameter.
          required: false
          schema:
            type: string
          example: 2021-01
        - name: opplysningspliktig
          in: query
          description: Identifikator (Organisasjonsnummer, fødselsnummer eller d-nummer) for opplysningspliktig. Parameteren opplysningspliktig er kun påkrevd for rettighetspakken OTP, for å sjekke at pensjonsinnretning har en gyldig avtale med opplysningspliktig for en forespurt periode. Kun med gyldig avtale kan en pensjonsinnretning få tilgang til inntektsmottaker data.
          required: false
          schema:
            type: string
          example: 12345678901
        - name: virksomhet
          in: query
          description: Identifikator (Organisasjonsnummer, fødselsnummer eller d-nummer) for virksomhet.
          required: false
          schema:
            type: string
          example: 123456789
        - name: historikk
          in: query
          description: 'historikk – boolean (default false): false – bare sist rapporterte inntektsopplysninger (gjeldende opplysninger) for en periode vil bli returnert true - alle rapporterte inntektsopplysninger i en periode vil bli returnert'
          required: false
          schema:
            type: boolean
            default: false
          example: 'true'
        - name: Korrelasjonsid
          in: header
          description: Korrelasjonsid, unik identifikator for den tekniske forespørselen. Må være på UUID-format
          required: false
          schema:
            type: string
            format: uuid
          example: 123e4567-e89b-12d3-a456-426655440000
        - name: AltinnSamtykke
          in: header
          description: Representasjon av samtykket (Altinn 2) man har innhentet fra skattyteren man henter data for. Gjelder kun for rettighetspakker som krever samtykke. Skal ikke anvendes for samtykker i Altinn 3.
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Gyldig respons
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OppgaverInntektsmottaker'
            application/xml:
              schema:
                $ref: '#/components/schemas/OppgaverInntektsmottaker'
        default:
          description: Diverse feilmeldinger, se egen dokumentasjon
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Feil'
            application/xml:
              schema:
                $ref: '#/components/schemas/Feil'
